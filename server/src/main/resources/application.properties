spring.application.name=TunnelFlowServer

# ─── Tomcat thread pool ────────────────────────────────────────────────────────
# Each tunneled request blocks a thread on CompletableFuture.get() while waiting
# for the client response. A React/Vite app can fire 20-50 concurrent requests
# on initial page load, so we need enough threads to handle bursts.
# Blocked threads use near-zero CPU, so 200 is safe even on small instances.
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# ─── Request size limit ────────────────────────────────────────────────────────
# Reject requests larger than 5 MB to prevent OOM from huge uploads.
# Adjust upward if your app legitimately handles large file uploads.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=5MB

# ─── Logging ───────────────────────────────────────────────────────────────────
# Keep INFO for our own packages; suppress debug noise from Spring internals.
logging.level.root=WARN
logging.level.org.tunnelflow=INFO

# ─── Disable devtools on production ────────────────────────────────────────────
# spring-boot-devtools is on the classpath; this makes sure it stays silent.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
