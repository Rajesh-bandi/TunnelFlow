spring.application.name=TunnelFlowServer

# ─── Tomcat thread pool ────────────────────────────────────────────────────────
# Default is 200 threads — overkill for a tunneling server on a free tier VM.
# 20 threads are more than enough: most time is spent blocking on CompletableFuture.
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5

# ─── Request size limit ────────────────────────────────────────────────────────
# Reject requests larger than 5 MB to prevent OOM from huge uploads.
# Adjust upward if your app legitimately handles large file uploads.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=5MB

# ─── Logging ───────────────────────────────────────────────────────────────────
# Keep INFO for our own packages; suppress debug noise from Spring internals.
logging.level.root=WARN
logging.level.org.tunnelflow=INFO

# ─── Disable devtools on production ────────────────────────────────────────────
# spring-boot-devtools is on the classpath; this makes sure it stays silent.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
