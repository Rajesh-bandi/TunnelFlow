name: Deploy TunnelFlow Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Build protocol
      - name: Build Protocol
        working-directory: protocol
        run: mvn clean install -DskipTests

      # Build server
      - name: Build Server
        working-directory: server
        run: mvn clean package -DskipTests

      # Rename JAR before upload
      - name: Prepare Deployment Artifact
        run: |
          cp server/target/TunnelFlowServer-0.0.1-SNAPSHOT.jar \
             server/target/TunnelFlowServer.jar

      # Upload JAR
      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "server/target/TunnelFlowServer.jar"
          target: "/home/ubuntu/apps/tunnelflow"

      # Restart application
      - name: Restart TunnelFlow
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set +e

            echo "Stopping old server..."

            if pgrep -f TunnelFlowServer >/dev/null; then
              pkill -f TunnelFlowServer
              sleep 5
            fi

            echo "Moving uploaded JAR..."

            mv /home/ubuntu/apps/tunnelflow/server/target/TunnelFlowServer.jar \
               /home/ubuntu/apps/tunnelflow/TunnelFlowServer.jar

            rm -rf /home/ubuntu/apps/tunnelflow/server

            echo "Starting new server..."

            cd /home/ubuntu/apps/tunnelflow

            nohup java -jar TunnelFlowServer.jar > server.log 2>&1 < /dev/null &

            sleep 10

            echo "Running process:"
            pgrep -af TunnelFlowServer || true

            echo "Recent logs:"
            tail -20 server.log || true

            exit 0