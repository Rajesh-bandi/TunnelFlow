name: Deploy TunnelFlow Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Build Protocol Module
      - name: Build Protocol
        working-directory: protocol
        run: mvn clean install -DskipTests

      # Build Server Module
      - name: Build Server
        working-directory: server
        run: mvn clean package -DskipTests

      # Copy JAR to EC2
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "server/target/TunnelFlowServer-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/apps/tunnelflow"

      # Restart Server
      - name: Restart TunnelFlow
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Stopping old server..."
            pkill -f TunnelFlowServer || true
            sleep 3

            echo "Moving new JAR..."
            mv /home/ubuntu/apps/tunnelflow/server/target/TunnelFlowServer-0.0.1-SNAPSHOT.jar \
               /home/ubuntu/apps/tunnelflow/TunnelFlowServer.jar

            rm -rf /home/ubuntu/apps/tunnelflow/server

            echo "Starting new server..."
            cd /home/ubuntu/apps/tunnelflow

            nohup java -jar TunnelFlowServer.jar > server.log 2>&1 &

            sleep 10

            echo "Running Processes:"
            ps -ef | grep TunnelFlowServer || true

            echo "Last 20 Log Lines:"
            tail -20 server.log || true