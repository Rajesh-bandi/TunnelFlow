name: Deploy TunnelFlow Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Protocol
        working-directory: protocol
        run: mvn clean install -DskipTests

      - name: Build Server
        working-directory: server
        run: mvn clean package -DskipTests

      - name: Prepare Deployment Artifact
        run: |
          cp server/target/TunnelFlowServer-0.0.1-SNAPSHOT.jar \
             server/target/TunnelFlowServer.jar

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "server/target/TunnelFlowServer.jar"
          target: "/home/ubuntu/apps/tunnelflow"

      - name: Restart TunnelFlow
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Deploying new JAR..."

            # Move uploaded JAR into place
            mv -f /home/ubuntu/apps/tunnelflow/server/target/TunnelFlowServer.jar \
                  /home/ubuntu/apps/tunnelflow/TunnelFlowServer.jar

            rm -rf /home/ubuntu/apps/tunnelflow/server

            # Find ONLY the Java process (ignore this SSH shell)
            PID=$(ps -eo pid,args | awk '/java -jar \/home\/ubuntu\/apps\/tunnelflow\/TunnelFlowServer\.jar/ && !/awk/ {print $1}')

            if [ -n "$PID" ]; then
              echo "Stopping existing server PID: $PID"
              kill -15 "$PID"
              sleep 5
            else
              echo "No existing server running."
            fi

            echo "Starting server..."

            cd /home/ubuntu/apps/tunnelflow

            nohup java -jar /home/ubuntu/apps/tunnelflow/TunnelFlowServer.jar \
              > server.log 2>&1 < /dev/null &

            sleep 10

            echo "Verifying deployment..."

            ps -ef | grep "[T]unnelFlowServer.jar"

            echo "Last 20 log lines:"
            tail -20 server.log